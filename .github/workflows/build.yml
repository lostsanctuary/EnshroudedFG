name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-vulkan-sdk

      # NGX headers only: building needs no Streamline DLLs.
      - name: Fetch NVIDIA headers
        shell: pwsh
        run: ./tools/fetch_deps.ps1 -SkipStreamline

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: winmm-${{ github.sha }}
          path: build/Release/winmm.dll
          if-no-files-found: error
